# ld65 リンカスクリプト — MMC3 (Mapper 4) / PRG 256KB / CHR 128KB
#
# PRG は 8KB × 32 バンク。MMC3 の PRG モード0 を前提とする:
#   $8000-$9FFF : 可変 (R6)      -> BANK00..BANK29 のいずれかを載せる
#   $A000-$BFFF : 可変 (R7)      -> 同上
#   $C000-$DFFF : 固定 (最後から2番目 = バンク30)
#   $E000-$FFFF : 固定 (最後     = バンク31)  … リセット/NMI/IRQ とコアはここ
#
# バンク管理を明示するため、32バンクすべてをメモリ領域として列挙する。
# バンクを1つ足す/減らすことは ROM 構成の変更であり、ADR を要する。

MEMORY {
    # --- RAM ---
    ZP:      start = $0000, size = $0100, type = rw, define = yes;
    STACK:   start = $0100, size = $0100, type = rw, define = yes;
    OAMBUF:  start = $0200, size = $0100, type = rw, define = yes;
    RAM:     start = $0300, size = $0500, type = rw, define = yes;
    PRGRAM:  start = $6000, size = $2000, type = rw, define = yes;

    # --- iNES ヘッダ ---
    HDR:     start = $0000, size = $0010, type = ro, file = %O, fill = yes;

    PRG00:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG01:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG02:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG03:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG04:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG05:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG06:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG07:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG08:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG09:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG10:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG11:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG12:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG13:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG14:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG15:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG16:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG17:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG18:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG19:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG20:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG21:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG22:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG23:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG24:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG25:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG26:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG27:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG28:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG29:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, define = yes;

    # 固定バンク（$C000 / $E000）
    PRG30:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, define = yes;
    PRG31:   start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, define = yes;
    VEC:     start = $FFFA, size = $0006, type = ro, file = %O, fill = yes;

    # --- CHR 128KB ---
    CHRROM:  start = $0000, size = $20000, type = ro, file = %O, fill = yes;
}

SEGMENTS {
    HEADER:   load = HDR,    type = ro;

    ZEROPAGE: load = ZP,     type = zp,  define = yes;
    OAM:      load = OAMBUF, type = bss, define = yes, align = $100;
    BSS:      load = RAM,    type = bss, define = yes;
    SAVERAM:  load = PRGRAM, type = bss, define = yes, optional = yes;

    BANK00:   load = PRG00, type = ro, optional = yes;
    BANK01:   load = PRG01, type = ro, optional = yes;
    BANK02:   load = PRG02, type = ro, optional = yes;
    BANK03:   load = PRG03, type = ro, optional = yes;
    BANK04:   load = PRG04, type = ro, optional = yes;
    BANK05:   load = PRG05, type = ro, optional = yes;
    BANK06:   load = PRG06, type = ro, optional = yes;
    BANK07:   load = PRG07, type = ro, optional = yes;
    BANK08:   load = PRG08, type = ro, optional = yes;
    BANK09:   load = PRG09, type = ro, optional = yes;
    BANK10:   load = PRG10, type = ro, optional = yes;
    BANK11:   load = PRG11, type = ro, optional = yes;
    BANK12:   load = PRG12, type = ro, optional = yes;
    BANK13:   load = PRG13, type = ro, optional = yes;
    BANK14:   load = PRG14, type = ro, optional = yes;
    BANK15:   load = PRG15, type = ro, optional = yes;
    BANK16:   load = PRG16, type = ro, optional = yes;
    BANK17:   load = PRG17, type = ro, optional = yes;
    BANK18:   load = PRG18, type = ro, optional = yes;
    BANK19:   load = PRG19, type = ro, optional = yes;
    BANK20:   load = PRG20, type = ro, optional = yes;
    BANK21:   load = PRG21, type = ro, optional = yes;
    BANK22:   load = PRG22, type = ro, optional = yes;
    BANK23:   load = PRG23, type = ro, optional = yes;
    BANK24:   load = PRG24, type = ro, optional = yes;
    BANK25:   load = PRG25, type = ro, optional = yes;
    BANK26:   load = PRG26, type = ro, optional = yes;
    BANK27:   load = PRG27, type = ro, optional = yes;
    BANK28:   load = PRG28, type = ro, optional = yes;
    BANK29:   load = PRG29, type = ro, optional = yes;

    FIXED:    load = PRG30,  type = ro, optional = yes;   # $C000 固定バンク
    CODE:     load = PRG31,  type = ro;                   # $E000 固定バンク
    RODATA:   load = PRG31,  type = ro, optional = yes;
    VECTORS:  load = VEC,    type = ro;

    CHR:      load = CHRROM, type = ro;
}
