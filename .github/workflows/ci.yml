name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cc65 を導入
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      - name: ビルド
        run: make

      - name: 回帰テスト
        run: make test

      # 予算超過は CI を落とす（CLAUDE.md 第4条 / 企画書 §7）
      - name: ROM 予算
        run: make budget

      - name: 予算レポートを成果物として残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget
          path: docs/budget.md
